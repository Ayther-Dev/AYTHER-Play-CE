name: Release

# Builds the Windows installer on a version tag (or by hand, without
# publishing):
#
#   stage (Play CE + locked Runtime) -> compile the setup -> publish
#
# The setup is not code-signed; its .sha256 file is published next to it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    name: Windows installer
    # The locked Runtime is linked by MSVC 14.5x (VS 2026): the app-local
    # Visual C++ DLLs must come from the same or a newer toolset.
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      setup: ${{ steps.compile.outputs.setup }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages |
              Where-Object name -eq 'ayther_play_ce' | ForEach-Object version
          if ($env:GITHUB_REF_NAME -ne "v$version" -and -not $env:GITHUB_REF_NAME.StartsWith("v$version-")) {
              throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $version."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # The runner image may already carry a newer Inno Setup; keep the pinned one.
          choco install innosetup --version=6.5.4 --allow-downgrade -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage Play CE and the locked Runtime
        id: stage
        shell: pwsh
        run: |
          $stage = ./tools/build-installer.ps1 -Step Stage | Select-Object -Last 1
          "stage=$stage" >> $env:GITHUB_OUTPUT

      - name: Compile the setup
        id: compile
        shell: pwsh
        run: |
          $setup = ./tools/build-installer.ps1 -Step Compile | Select-Object -Last 1
          "setup=$(Split-Path $setup -Leaf)" >> $env:GITHUB_OUTPUT

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: |
            dist/${{ steps.compile.outputs.setup }}
            dist/${{ steps.compile.outputs.setup }}.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: installer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: installer
          path: dist

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SETUP: ${{ needs.installer.outputs.setup }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c "$SETUP.sha256")
          gh release create "$GITHUB_REF_NAME" "dist/$SETUP" "dist/$SETUP.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "AYTHER Play CE $GITHUB_REF_NAME" \
            --notes "Windows installer (per user, no administrator rights) with the locked AYTHER Runtime and Tessera. Verify with the .sha256 file."
