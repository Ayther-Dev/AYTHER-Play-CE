name: Play checks
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Prepare pinned Runtime source
        shell: pwsh
        run: |
          ./tools/prepare-runtime.ps1
          "AYTHER_RUNTIME_SOURCE=$env:AYTHER_RUNTIME_SOURCE" >> $env:GITHUB_ENV
      - run: cargo fmt --all -- --check
      - run: cargo check -p ayther_play_ce --all-targets --all-features --locked
      - run: cargo clippy -p ayther_play_ce --all-targets --all-features --locked -- -D warnings
      - run: cargo test -p ayther_play_ce --all-features --locked
      # Signature policy previously differed between debug and release readers.
      - run: cargo test -p ayther_play_ce --release --locked --test offline_packs
